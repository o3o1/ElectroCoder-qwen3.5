[project]
name = "electrocoder-training"
version = "2.0.0"
description = "Qwen3.5 text LoRA and QLoRA training for ElectroCoder"
requires-python = ">=3.11,<3.12"
dependencies = [
  "llamafactory==0.9.5",
  "transformers==5.6.0",
  "peft==0.18.1",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "torchaudio==2.10.0",
  "bitsandbytes>=0.49,<0.50",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
required-version = ">=0.8.15"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
